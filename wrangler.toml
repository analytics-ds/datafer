name = "datafer"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]
# worker.ts enveloppe le worker OpenNext avec le verrou par mot de passe
# (src/lib/gate.ts). Secrets requis : GATE_PASSWORD, PROXY_SECRET.
main = "worker.ts"

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# L'URL workers.dev est la seule adresse servie par ce worker. Le domaine
# corpus.datashake.fr est un CNAME vers le projet Pages « corpus-proxy »
# qui relaie vers cette URL : la zone datashake.fr n'est PAS dans ce compte
# Cloudflare, donc ne jamais déclarer de `routes` ici (le deploy échoue en
# code 10082 et désactive workers.dev au passage, prod en 404).
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "datafer"
database_id = "52061f81-b4f5-4b32-9685-a015b0981a29"
migrations_dir = "drizzle"

# Queue Cloudflare consommée par le worker datafer-analysis-consumer.
# Le worker principal (Next.js OpenNext) push les messages depuis
# /api/briefs et /api/v1/briefs. Le consumer fait l'analyse complète
# dans son propre budget CPU/wall, isolé du worker HTTP.
[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "datafer-analysis-v2"

# Queue dédiée au maillage interne : le bouton "Lancer l'index" / "Resync"
# côté UI enqueue un message {clientId, mode} au lieu de faire la sync
# inline (qui timeout à ~30s sur les sites lents type Celio/Datadome qui
# crawl en 3-10s par URL via Bright Data). Le consumer dispose de 300s CPU
# par invocation et ré-enqueue un follow-up si hasMore=true.
[[queues.producers]]
binding = "SITEMAP_SYNC_QUEUE"
queue = "datafer-sitemap-sync-v2"

# Cloudflare Workers AI : utilisé pour générer les embeddings sémantiques
# (modèle bge-m3 multilingue) qui permettent de calculer la similarité entre
# le keyword et les nlpTerms et de clusteriser les termes par champ lexical.
# Inclus gratuitement dans Workers Paid Plan (quota neurons large).
[ai]
binding = "AI"

[vars]
BETTER_AUTH_URL = "https://corpus.datashake.fr"
# Provider SERP : "crazyserp" (par défaut, ~$0.50/1k FR) ou "serpapi"
# (~$10/1k). Peut être basculé sans redeploy via `wrangler secret put` ou
# en éditant cette ligne et `npm run deploy`.
# Bright Data en provider SERP depuis le 14/09/2026 (panne CrazySerp). Surcoût
# chiffré et accepté : ~1 € par millier de briefs. Pas d'urgence à rebasculer,
# cf. le commentaire détaillé dans wrangler-analysis.toml.
SERP_PROVIDER = "brightdata"
# Repli SERP Bright Data quand le provider principal ne renvoie rien (panne
# fournisseur). Activé le 14/09/2026 suite à la panne CrazySerp. "0" pour couper.
SERP_BRIGHTDATA_FALLBACK = "1"
# Compte Cloudflare pour appeler la Browser Rendering REST API en
# fallback de crawl (sites bloquants type Akamai). Free tier : 10 min/j.
CF_ACCOUNT_ID = "e0dd71e4cd791925c9b37a85496aa259"
# Prod : seul l'accès direct à l'URL workers.dev demande le mot de passe,
# corpus.datashake.fr passe par corpus-proxy qui signe ses requêtes.
GATE_MODE = "direct"

# Secrets set via `wrangler secret put`:
# - BETTER_AUTH_SECRET       (openssl rand -base64 32)
# - CRAZYSERP_KEY            (crazyserp.com, provider par défaut)
# - SERPAPI_KEY              (serpapi.com, provider de fallback)
# - HALOSCAN_KEY             (haloscan JWT)
# - CF_BROWSER_TOKEN         (Cloudflare API token, perm. "Browser Rendering: Edit")
# - SCRAPINGBEE_KEY          (scrapingbee.com, fallback niveau 3 IP résidentielles)

# ─── Preprod ────────────────────────────────────────────────────────────────
# Environnement de test séparé : worker, base D1 et queues à part, copie des
# données de prod au 2026-09-30. Tout est derrière le mot de passe (GATE_MODE
# "all"). URL : https://datafer-preprod.analytics-e0d.workers.dev
# Déploiement : npm run deploy:preprod (ou push sur la branche preprod).
# Les sections [env.*] n'héritent ni des bindings ni des vars : tout est
# redéclaré ici.
[env.preprod]
name = "datafer-preprod"
workers_dev = true

[[env.preprod.d1_databases]]
binding = "DB"
database_name = "datafer-preprod"
database_id = "7afc3406-4331-41fc-97dc-e98a3fbaa9b6"
migrations_dir = "drizzle"

[[env.preprod.queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "datafer-analysis-preprod"

[[env.preprod.queues.producers]]
binding = "SITEMAP_SYNC_QUEUE"
queue = "datafer-sitemap-sync-preprod"

[env.preprod.ai]
binding = "AI"

[env.preprod.vars]
BETTER_AUTH_URL = "https://datafer-preprod.analytics-e0d.workers.dev"
# Pas de clé Bright Data en preprod (les secrets de prod ne sont pas
# relisibles) : CrazySerp seul. Poser BRIGHTDATA_TOKEN / BRIGHTDATA_ZONE sur
# les deux workers preprod pour revenir à la config de prod.
SERP_PROVIDER = "crazyserp"
SERP_BRIGHTDATA_FALLBACK = "0"
CF_ACCOUNT_ID = "e0dd71e4cd791925c9b37a85496aa259"
GATE_MODE = "all"
