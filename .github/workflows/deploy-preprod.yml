name: Deploy preprod

# Preprod : https://datafer-preprod.analytics-e0d.workers.dev (mot de passe).
# Se déploie sur un push de la branche preprod, ou à la main depuis l'onglet
# Actions en choisissant la branche à tester.
on:
  push:
    branches: [preprod]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Apply D1 migrations (preprod)
        run: npm run db:migrate:preprod

      - name: Generate Cloudflare types (cloudflare-env.d.ts)
        run: npm run cf-typegen

      - name: Deploy preprod (worker Next + consumer)
        run: npm run deploy:preprod
